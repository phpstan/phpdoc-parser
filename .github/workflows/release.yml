# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Create release"

on:
  push:
    tags:
      - '*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: "Deploy"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read # for actions/checkout to fetch the code; the release is created with PHPSTAN_BOT_TOKEN

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate changelog
        id: changelog
        uses: metcalfc/changelog-generator@bb7a08e07e326061351dab6ce89c72f13797043c # v4.9.1
        with:
          myToken: ${{ secrets.PHPSTAN_BOT_TOKEN }}

      - name: "Create release"
        run: 'gh release create "$TAG" --verify-tag --title "$TAG" --notes "$CHANGELOG"'
        env:
          GH_TOKEN: ${{ secrets.PHPSTAN_BOT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
