# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Send pull request"

on:
  release:
    types: [published]

# GITHUB_TOKEN needs no permissions: phpstan-src is checked out and the pull request
# is sent as phpstan-bot with PHPSTAN_BOT_PULL_REQUESTS_TOKEN from the bot-pr environment.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send-pr:
    name: "Send pull request"
    runs-on: "ubuntu-latest"
    environment:
      name: bot-pr
      deployment: false
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: "Install PHP"
        uses: "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962" # v2
        with:
          coverage: "none"
          php-version: "8.1"

      - name: "Checkout phpstan-src"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: phpstan/phpstan-src
          path: phpstan-src
          ref: 2.3.x

      - name: "Install dependencies"
        working-directory: ./phpstan-src
        run: "composer install --no-interaction --no-progress --no-suggest"

      - name: "Change composer.json"
        working-directory: ./phpstan-src
        run: 'composer require "phpstan/phpdoc-parser:$TAG"'
        env:
          TAG: ${{ github.ref_name }}

      # It commits, pushes a branch and opens the pull request in one step, which `gh pr create`
      # alone does not do.
      - name: "Create Pull Request" # zizmor: ignore[superfluous-actions]
        id: create-pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.PHPSTAN_BOT_PULL_REQUESTS_TOKEN }}
          path: ./phpstan-src
          branch-suffix: random
          delete-branch: true
          title: "Update phpdoc-parser"
          body: "Update phpstan/phpdoc-parser to ${{ github.ref_name }}"
          committer: "phpstan-bot <ondrej+phpstanbot@mirtes.cz>"
          commit-message: "Update phpdoc-parser"
