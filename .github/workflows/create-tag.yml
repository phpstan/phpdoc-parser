# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Create tag"

on:
  # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#workflow_dispatch
  workflow_dispatch:
    inputs:
      version:
        description: 'Next version'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor

jobs:
  create-tag:
    name: "Create tag"
    runs-on: "ubuntu-latest"
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PHPSTAN_BOT_TOKEN }}

      - name: 'Get Previous tag'
        id: previoustag
        uses: "WyriHaximus/github-action-get-previous-tag@83f26fea93bc7efcbca2eb5591f5eaaf66b8f206" # v2.1.0
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: 'Get next versions'
        id: semvers
        uses: "WyriHaximus/github-action-next-semvers@18aa9ed4152808ab99b88d71f5481e41f8d89930" # v1.2.1
        with:
          version: ${{ steps.previoustag.outputs.tag }}

      - name: "Create new minor tag"
        uses: rickstaa/action-create-tag@a1c7777fcb2fee4f19b0f283ba888afa11678b72 # v1.7.2
        if: inputs.version == 'minor'
        with:
          tag: ${{ steps.semvers.outputs.minor }}
          message: ${{ steps.semvers.outputs.minor }}

      - name: "Create new patch tag"
        uses: rickstaa/action-create-tag@a1c7777fcb2fee4f19b0f283ba888afa11678b72 # v1.7.2
        if: inputs.version == 'patch'
        with:
          tag: ${{ steps.semvers.outputs.patch }}
          message: ${{ steps.semvers.outputs.patch }}
